<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>ふたりのすきな沖縄</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fdfcf8;
  --ink:#1e2b2c;
  --ink2:#5d6c6c;
  --ink3:#9aa5a4;
  --sea:#1f6f78;
  --sea-pale:#dbeced;
  --sand:#e9dcc0;
  --leaf:#4c7a44;
  --venue:#c0562f;
  --jp:"Zen Maru Gothic",system-ui,sans-serif;
  --en:"Quicksand",system-ui,sans-serif;
  --s1:8px;--s2:16px;--s3:24px;--s4:40px;--s5:72px;--s6:112px;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--jp);line-height:1.95;letter-spacing:.02em;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.wrap{max-width:820px;margin:0 auto;padding:0 22px}

/* ================= ヒーロー（縦書き） ================= */
.hero{display:flex;padding:56px 0 48px}
.hero .in{max-width:820px;margin:0 auto;padding:0 22px;width:100%;display:flex;justify-content:space-between;gap:var(--s4)}
.hero .side{display:flex;flex-direction:column;justify-content:space-between;padding-bottom:var(--s1)}
.hero .eb{font-family:var(--en);font-weight:700;font-size:11px;letter-spacing:.24em;color:var(--sea)}
.hero .lead{max-width:13.5em;font-size:13.5px;line-height:2.3;color:var(--ink2);letter-spacing:.05em}
.tate{
  writing-mode:vertical-rl;text-orientation:mixed;
  font-weight:700;font-size:clamp(32px,9.8vw,56px);line-height:1.8;letter-spacing:.22em;
}
.tate span{color:var(--sea)}

/* ================= 絞り込み（上に残る） ================= */
.filters{position:sticky;top:0;z-index:30;background:rgba(253,252,248,.96);backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);border-top:1px solid #e6e3da;border-bottom:1px solid #e6e3da;padding:16px 0}
.frow{max-width:820px;margin:0 auto;display:flex;align-items:center}
.frow + .frow{margin-top:12px}
.frow .lab{flex:0 0 auto;width:82px;padding-left:22px;font-size:10.5px;font-weight:700;letter-spacing:.08em;color:var(--ink3)}
.chips{flex:1;min-width:0;display:flex;align-items:center;gap:8px;overflow-x:auto;scrollbar-width:none;padding-right:22px}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;display:inline-flex;align-items:baseline;gap:4px;cursor:pointer;
  font-family:var(--jp);font-weight:500;font-size:12.5px;letter-spacing:.02em;white-space:nowrap;
  color:var(--ink);background:transparent;border:1px solid #e0ddd3;border-radius:20px;padding:5px 13px;
  -webkit-tap-highlight-color:transparent;transition:background .15s,color .15s;
}
.chip small{font-family:var(--en);font-weight:600;font-size:10px;color:var(--ink3)}
/* 地方の色 */
/* カテゴリの色 */
.k-food{--cg:#c65a34;--cgp:#f5ddd2}   /* ごはん：赤瓦 */
.k-cafe{--cg:#7a5238;--cgp:#eadfd6}   /* カフェ：コーヒー */
.k-nat {--cg:#4c7a44;--cgp:#dde8d8}   /* 自然：やんばるの森 */
.k-exp {--cg:#1f6f78;--cgp:#d5e9ea}   /* 体験：海 */
.k-shop{--cg:#b0507a;--cgp:#f2dbe5}   /* 買い物：ブーゲンビリア */
.k-etc {--cg:#6b7475;--cgp:#e3e5e4}   /* その他 */
.chip.cat{align-items:center;border-color:var(--cgp);border-width:1.5px;color:var(--cg);font-weight:700}
.chip.cat small{color:var(--cg);opacity:.6}
.chip.cat.on{background:var(--cg);border-color:var(--cg);color:#fff}
.chip.cat.on small{color:#fff;opacity:.8}
b.k-food,b.k-cafe,b.k-nat,b.k-exp,b.k-shop,b.k-etc,.kt{color:var(--cg);font-weight:700}
.ic{flex:0 0 auto;width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chip .ic{width:15px;height:15px;align-self:center;margin-right:1px}
b .ic{display:inline-block;vertical-align:-.2em;margin-right:.25em}
.pin .ic{width:64%;height:64%;stroke:#fff;stroke-width:2.3}
h2.kt{font-weight:900}
.chip.reg{font-weight:700}
.chip.on small{color:var(--sand);opacity:1}
.cityrow .lab{position:relative;height:28px}
@media(max-width:420px){.frow .lab{width:68px;padding-left:18px}.chips{gap:6px;padding-right:18px}}
.cityrow .lab::after{content:"";position:absolute;right:14px;top:-4px;width:12px;height:18px;border-left:2px solid #cfcbc0;border-bottom:2px solid #cfcbc0;border-bottom-left-radius:6px;opacity:.5}

/* ================= 地図 ================= */
.mapsec{background:var(--sea-pale);padding:var(--s4) 0 var(--s4)}
body.onlymap .hero,body.onlymap .filters,body.onlymap .list,body.onlymap footer{display:none}
body.onlymap .mapsec .hd,body.onlymap .maphint{display:none}
body.onlymap .mapsec{padding:10px 0 12px}
.hd{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s2)}
.hd h2{font-weight:900;font-size:26px;letter-spacing:.06em}
.hd span{font-family:var(--en);font-weight:700;font-size:11px;letter-spacing:.18em;color:var(--ink3)}
.mapsec .hd h2{color:var(--sea)}
.mapsec .hd span{color:var(--sea);opacity:.6}
.mapbox{margin-top:var(--s3);border-radius:14px;overflow:hidden;background:var(--sea-pale);border:2px solid #fff}
.maphint{margin-top:var(--s2);font-size:12px;line-height:1.9;color:#6f8b8c}

.illmap{
  position:relative;width:100%;aspect-ratio:724/900;overflow:hidden;
  touch-action:pan-y;cursor:grab;-webkit-user-select:none;user-select:none;
}
.illmap.zoomed{touch-action:none}
.illmap.dragging{cursor:grabbing}
.illmap .leads{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none;overflow:visible}
.illmap .leads line{stroke:var(--cg,var(--sea));stroke-width:1.2;opacity:.55}
.illmap .leads circle{fill:var(--cg,var(--sea))}
.illmap > svg:not(.compass):not(.leads){position:absolute;inset:0;width:100%;height:100%;display:block;transform-origin:0 0}

.illmap .land path{fill:var(--sand);stroke:#fff;stroke-width:var(--sw,2.4px);stroke-linejoin:round;vector-effect:non-scaling-stroke}
.illmap .landshadow{display:none}
.illmap .placenames text{font-family:var(--jp);font-weight:500;font-size:calc(14px / var(--k,1));letter-spacing:.1em;fill:#6f8b8c}
.illmap .placenames text.lv2{opacity:0;transition:opacity .3s;font-size:calc(12.5px / var(--k,1))}
.illmap.detail .placenames text.lv2{opacity:.85}
.illmap .airport circle{fill:#fff;stroke:var(--sea);stroke-width:1.6;vector-effect:non-scaling-stroke}
.illmap .airport path{stroke:var(--sea)}
.illmap .airport text{font-family:var(--jp);font-weight:500;font-size:12.5px;letter-spacing:.08em;fill:#6f8b8c}
.illmap .compass{position:absolute;right:12px;bottom:12px;z-index:7;width:48px;height:48px;pointer-events:none;overflow:visible}
.illmap .compass circle{stroke:var(--sea);opacity:.35}
.illmap .compass path{fill:var(--sea);opacity:.5}
.illmap .compass text{font-family:var(--en);font-weight:700;font-size:12px;fill:var(--sea);opacity:.55}

.mapctl{position:absolute;right:10px;top:10px;z-index:8;display:flex;flex-direction:column;gap:6px}
.mapctl button{
  width:36px;height:36px;border-radius:50%;cursor:pointer;border:0;background:#fff;color:var(--sea);
  font-family:var(--en);font-weight:700;font-size:18px;line-height:1;display:flex;align-items:center;justify-content:center;
  box-shadow:0 1px 4px rgba(31,111,120,.18);-webkit-tap-highlight-color:transparent;
}
.mapctl button:active{background:var(--sea);color:#fff}
.mapctl button.reset{font-family:var(--jp);font-size:11px}
.zoomhint{position:absolute;left:12px;top:12px;z-index:8;pointer-events:none;font-family:var(--en);font-weight:700;font-size:11px;color:var(--sea);opacity:.6}

.pin{
  position:absolute;transform:translate(-50%,-50%);z-index:3;
  width:26px;height:26px;border-radius:50%;background:var(--cg,var(--sea));border:2px solid #fff;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  font-family:var(--en);font-weight:700;font-size:11px;color:#fff;letter-spacing:0;
  box-shadow:0 1px 4px rgba(20,60,64,.25);
  transition:transform .2s cubic-bezier(.19,1,.22,1),background .15s;
  -webkit-tap-highlight-color:transparent;
}
.illmap:not(.detail) .pin:not(.venue){width:19px;height:19px;font-size:8.5px;border-width:1.5px}
.pin.act{transform:translate(-50%,-50%) scale(1.25);z-index:6;box-shadow:0 0 0 2px #fff,0 0 0 4px var(--cg,var(--sea))}
.pin.venue{width:34px;height:34px;background:#fff;border:3px solid var(--ink);color:var(--ink);
  font-family:var(--jp);font-size:10px;z-index:4;cursor:default}
.plabel{
  position:absolute;z-index:2;pointer-events:none;white-space:nowrap;
  font-size:11px;font-weight:500;letter-spacing:.02em;color:var(--ink);
  background:#fff;border-radius:3px;padding:2px 7px;box-shadow:0 1px 3px rgba(20,60,64,.12);
  opacity:0;transition:opacity .25s;max-width:170px;overflow:hidden;text-overflow:ellipsis;
}
.illmap.detail .plabel{opacity:1}

/* ================= 一覧 ================= */
.list{padding:var(--s4) 0 var(--s5)}
.list .hd{margin-bottom:var(--s3)}
.list .hd .r{display:flex;align-items:baseline;gap:var(--s2)}
#resetBtn{background:none;border:0;border-bottom:1px solid var(--ink3);font-family:var(--jp);font-size:12px;color:var(--ink2);cursor:pointer;padding:0 0 1px}
.grid{display:grid;gap:12px}
.ghd{grid-column:1/-1;display:flex;align-items:center;gap:12px;margin:14px 0 2px;
  font-size:12px;font-weight:700;letter-spacing:.16em;color:var(--sea)}
.ghd::after{content:"";flex:1;height:1px;background:#e0ddd3;opacity:.9}
.grid > .ghd:first-child{margin-top:0}
@media(min-width:900px){.grid{grid-template-columns:1fr 1fr}}
.cell{display:grid;grid-template-columns:24px 1fr;column-gap:10px;border:2px solid var(--ink);border-radius:3px;padding:18px 20px 18px 16px;cursor:pointer;background:var(--bg);transition:background .15s,color .15s}
.cell > *{grid-column:2}
.cell > .no{grid-column:1;grid-row:1 / span 3;text-align:right;padding-top:5px;margin:0}
@media(hover:hover){
  .cell:hover{background:var(--ink);color:var(--bg)}
  .cell:hover .m,.cell:hover p{color:inherit;opacity:.85}
  .cell:hover .no{color:var(--sand)}
}
.cell .no{font-family:var(--en);font-weight:700;font-size:11px;letter-spacing:.04em;color:var(--cg,var(--sea))}
.cell h3{font-weight:700;font-size:16px;line-height:1.6}
.cell .m{margin-top:2px;font-size:11.5px;font-weight:500;letter-spacing:.06em;color:var(--ink3)}
.cell p{margin-top:10px;font-size:12.5px;line-height:1.9;color:var(--ink2);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{padding:var(--s4) 0;text-align:center;font-size:13px;color:var(--ink3)}

/* ================= 詳細シート ================= */
.sheet-bg{position:fixed;inset:0;background:rgba(20,32,32,.5);z-index:60;opacity:0;transition:opacity .25s}
.sheet-bg.on{opacity:1}
.sheet{
  position:fixed;left:50%;bottom:0;transform:translate(-50%,100%);
  width:min(560px,100%);max-height:88vh;overflow-y:auto;z-index:61;background:var(--bg);
  border-top:3px solid var(--ink);transition:transform .32s cubic-bezier(.19,1,.22,1);
}
.sheet.on{transform:translate(-50%,0)}
.sheet .grab{width:40px;height:4px;border-radius:4px;background:#dcd8cd;margin:10px auto 0}
.sheet .photo{margin:16px 22px 0;border-radius:3px;overflow:hidden;background:var(--sea-pale);aspect-ratio:4/3}
.sheet .photo img{width:100%;height:100%;object-fit:cover;display:block}
.sheet .cred{margin:6px 22px 0;font-size:9.5px;color:var(--ink3);text-align:right}
.sheet .body{padding:22px 22px 32px}
.sheet .sno{font-family:var(--en);font-weight:700;font-size:12px;letter-spacing:.14em;color:var(--cg,var(--sea))}
.sheet h3{margin-top:4px;font-weight:900;font-size:21px;line-height:1.55}
.sheet .meta{margin-top:8px;display:flex;align-items:center;flex-wrap:wrap;gap:6px;font-size:12px;font-weight:500;color:var(--ink3)}
.sheet .meta i{display:none}
.sheet .meta .sep{opacity:.4}
.sheet .desc{margin-top:var(--s3);font-size:14px;line-height:2.2;color:var(--ink2)}
.sheet .tags{margin-top:var(--s2);display:flex;flex-wrap:wrap;gap:6px}
.sheet .tag{font-size:11px;background:var(--sea-pale);color:var(--sea);padding:4px 10px;border-radius:2px}
.sheet .web{display:inline-block;margin-top:var(--s3);font-size:12.5px;color:var(--sea);text-decoration:none;border-bottom:1px solid currentColor;padding-bottom:1px}
.sheet .acts{margin-top:var(--s4);display:flex;gap:10px}
.sheet .acts a,.sheet .acts button{
  flex:1;text-align:center;font-family:var(--jp);font-weight:700;font-size:13.5px;letter-spacing:.04em;
  padding:15px 10px;border-radius:3px;text-decoration:none;cursor:pointer;border:2px solid var(--ink);
}
.sheet .acts .go{flex:1.6;background:var(--ink);color:var(--bg)}
.sheet .acts .close{background:var(--bg);color:var(--ink)}
@media(min-width:600px){
  .sheet{bottom:auto;top:50%;transform:translate(-50%,-44%);opacity:0;border:3px solid var(--ink);border-radius:4px;pointer-events:none;transition:transform .3s cubic-bezier(.19,1,.22,1),opacity .2s}
  .sheet.on{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
  .sheet .grab{display:none}
}

/* ================= footer ================= */
footer{background:var(--ink);color:var(--bg);padding:var(--s5) 0 var(--s5);text-align:center}
footer .m{font-size:13.5px;letter-spacing:.1em;opacity:.8}
footer .n{margin-top:var(--s2);font-family:var(--en);font-weight:700;font-size:clamp(26px,8vw,44px);letter-spacing:.01em}
footer .c{margin-top:var(--s4);font-size:10px;opacity:.4}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="hero">
  <div class="in">
    <div class="side">
      <p class="eb">The Okinawa We Love</p>
      <p class="lead">観光地も<br>そうでない場所も、<br>二人が好きな沖縄を<br>集めました。</p>
    </div>
    <h1 class="tate">ふたりの<span>すきな沖縄</span></h1>
  </div>
</header>

<div class="filters" id="filters">
  <div class="frow"><span class="lab">カテゴリ</span><div class="chips" id="fCat"></div></div>
  <div class="frow"><span class="lab">エリア</span><div class="chips" id="fArea"></div></div>
  <div class="frow cityrow" id="cityRow" hidden><span class="lab"></span><div class="chips" id="fCity"></div></div>
</div>

<section class="mapsec"><div class="wrap">
  <div class="hd"><h2>地図</h2><span>THE MAP</span></div>
  <div class="mapbox"><div class="illmap" id="illmap"></div></div>
  <p class="maphint" id="mapHint"></p>
</div></section>

<section class="list"><div class="wrap">
  <div class="hd"><h2 id="listTitle">一覧</h2><div class="r"><button id="resetBtn" hidden>絞り込みを外す</button><span id="count"></span></div></div>
  <div class="grid" id="cards"></div>
  <p class="empty" id="empty" hidden>この組み合わせの場所はありません。</p>
</div></section>

<footer>
  <p class="m">沖縄で会いましょう。</p>
  <div class="n">HIROAKI &amp; ERIKA</div>
  <p class="c">地形データ © OpenStreetMap contributors</p>
</footer>

<div class="sheet-bg" id="sheetBg" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true"></div>

<script>
/* =========================================================================
   スポットのデータ。ここを書き換えるだけで、一覧も地図も更新されます。
   lat / lng … 地図のピンの位置
   ※ サンプルの座標はおおよそです。「マップ」ボタンは名前でGoogle検索するので、
      ナビ自体はピンの精度に関係なく正しい場所に飛びます。
   ========================================================================= */
const VENUE = { name:"美々ビーチいとまん", lat:26.13323, lng:127.65050 };

const SPOTS = [
  { name:"ハイアット リージェンシー 瀬良垣アイランド 沖縄", city:"恩納村", area:"中部", cat:"カフェ", when:["前日","翌日"], by:"both",
    lat:26.494987, lng:127.873100, gmap:"https://maps.app.goo.gl/GrHUUdSmbpEDLFVs9",
    comment:"泊まらなくても、ロビーラウンジ＆バーやプールサイドはビジターで使えます。プールサイドでゆっくりドリンクを飲みながら、リゾート気分を味わうのがおすすめ。海も見えます。", tags:["日帰りでもOK","プールサイド","海が見える"], min:70, todo:false },
  { name:"ぬちまーす工場（ぬちうなー）", city:"うるま市", area:"中部", cat:"体験", when:["翌日"], by:"both",
    lat:26.372847, lng:127.989555, gmap:"https://maps.app.goo.gl/92H9vyeU41FSLVhb9",
    comment:"アスリートも使う塩の工場。一般的な食塩と比べて塩分が約25%低く、マグネシウムやカリウムなど21種類の海洋ミネラルがそのまま豊富に含まれています。夏の熱中症対策にも、普段の栄養補給にも。", tags:["工場見学","おみやげ"], min:80, todo:false },
  { name:"ゆんたくコリビング One Story.s / ワンストーリーズ", city:"本部町", area:"北部", cat:"その他", when:["前日","翌日"], by:"both",
    lat:26.701063, lng:127.894981, gmap:"https://maps.app.goo.gl/QQ6XtWrVJXiwYqdH7",
    comment:"今年の2月に、ひと月ほど滞在した場所。毎晩のゆんたくが本当にいい時間で、家族みたいに思える人たちができました。オーナーご夫婦とご家族も、今回ゲストとして来てくれます。", tags:["泊まれる","思い出の場所"], min:120, todo:false },
  { name:"備瀬のフクギ並木", city:"本部町", area:"北部", cat:"自然", when:["前日","翌日"], by:"both",
    lat:26.700535, lng:127.880211, gmap:"https://maps.app.goo.gl/UkrVZFpZaudwgdN2A",
    comment:"並木のなかは、ただ歩くだけで雰囲気がいいです。夕日の時間のチルにもいい場所。蚊が多いので、虫除けだけは必ず持っていってください。", tags:["虫除け必須","夕日"], min:120, todo:false },
  { name:"ナゴノバ（nagonova）", city:"名護市", area:"北部", cat:"その他", when:["前日","翌日"], by:"both",
    lat:26.605425, lng:127.971848, gmap:"https://maps.app.goo.gl/8s8DZ7331zFu2Bvm9",
    comment:"名護にある、公園みたいに誰でも自由に使えるコミュニティスペース。本を読んでも、卓球をしても、ただ座っているだけでもいい場所です。フリーマーケットやミュージックナイト、ワークショップも開かれています。火〜土 10:00〜21:00 ／ 日 10:00〜18:00、月曜休み。", tags:["誰でも入れる","イベントあり","月曜休み"], min:120, todo:false },
  { name:"果報バンタ", city:"うるま市", area:"中部", cat:"自然", when:["前日","翌日"], by:"both",
    lat:26.372847, lng:127.989555, gmap:"https://maps.app.goo.gl/RTPuzpCKofyFdG6bA",
    comment:"下に降りることはできませんが、高台から「これぞ沖縄の海」という絶景が見られます。", tags:["絶景"], min:80, todo:false },

/* ▼ 地図のピンに出すもの。"icon" = カテゴリのマーク ／ "number" = 番号
   比較用に ?mark=number で番号、?view=map で地図だけ表示できる */
const QS = new URLSearchParams(location.search);
const PIN_MARK = QS.get("mark") === "number" ? "number" : "icon";
if(QS.get("view") === "map") document.body.classList.add("onlymap");
const CATS = ["ごはん","カフェ","自然","体験","買い物","その他"];

const state = { cat:"", region:"", city:"" };
const mapUrl = s => s.gmap || ("https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(s.q || (s.name + " 沖縄")));
const inArea = s => (!state.city || s.city === state.city) && (!state.region || REGION[state.region].includes(s.city));

function buildFilters(){
  const cnt = f => SPOTS.filter(f).length;
  document.getElementById("fCat").innerHTML =
    `<button class="chip on" data-v="">すべて</button>` +
    CATS.filter(c => cnt(s => s.cat === c))
        .map(c => `<button class="chip cat ${KCLS[c]}" data-v="${c}">${icon(c)}${c}<small>${cnt(s => s.cat === c)}</small></button>`).join("");
  document.getElementById("fArea").innerHTML =
    `<button class="chip on" data-v="">すべて</button>` +
    Object.keys(REGION).map(r =>
      `<button class="chip reg" data-v="${r}">${r}</button>`).join("");
}

function buildCities(){
  const r = state.region, row = document.getElementById("cityRow");
  row.hidden = !r;
  row.className = "frow cityrow";
  if(!r) return;
  const cnt = c => SPOTS.filter(s => s.city === c).length;
  document.getElementById("fCity").innerHTML = REGION[r].filter(cnt).map(c =>
    `<button class="chip city${state.city === c ? " on" : ""}" data-v="${c}">${c}<small>${cnt(c)}</small></button>`).join("");
}

function render(){
  const list = SPOTS.filter(s => (!state.cat || s.cat === state.cat) && inArea(s));
  const filtered = !!(state.cat || state.region);

  let lastRegion = "";
  document.getElementById("cards").innerHTML = list.map(s => {
    const r = cityRegion(s.city);
    const head = (!state.region && r && r !== lastRegion) ? `<h3 class="ghd">${r}</h3>` : "";
    lastRegion = r;
    return head + `
    <article class="cell" data-name="${esc(s.name)}">
      <div class="no ${kc(s)}">${pad(s.no)}</div>
      <h3>${s.name}</h3>
      <div class="m">${s.city} ／ <b class="${kc(s)}">${icon(s.cat)}${s.cat}</b></div>
      <p>${s.comment || ""}</p>
    </article>`;
  }).join("");

  document.getElementById("empty").hidden = list.length > 0;
  document.getElementById("count").textContent = filtered ? `${list.length} / ${SPOTS.length}` : `${SPOTS.length} PLACES`;
  document.getElementById("resetBtn").hidden = !filtered;
  document.getElementById("listTitle").textContent =
    filtered ? [state.city || state.region, state.cat].filter(Boolean).join("・") : "一覧";
  document.getElementById("listTitle").className = state.cat ? "kt " + KCLS[state.cat] : "";

  syncMap(list);
}

/* 点の列を、なめらかな曲線（Catmull-Rom）でつないだパスにする。
   点は実測の海岸線なので、なめらかにしても形は崩れません。 */
function coastPath(pts){
  const p = pts.map(([lng,lat]) => [px(lng), py(lat)]);
  const n = p.length;
  if(n < 3) return pts.map(([lng,lat],i) =>
    `${i ? "L" : "M"}${px(lng).toFixed(1)},${py(lat).toFixed(1)}`).join(" ") + "Z";

  const T = 0.05;                              /* 曲がり具合。大きいほど丸くなる */
  const at = i => p[((i % n) + n) % n];
  const f = v => v.toFixed(1);

  let d = `M${f(p[0][0])},${f(p[0][1])}`;
  for(let i = 0; i < n; i++){
    const p0 = at(i-1), p1 = at(i), p2 = at(i+1), p3 = at(i+2);
    const c1 = [p1[0] + (p2[0]-p0[0]) * T, p1[1] + (p2[1]-p0[1]) * T];
    const c2 = [p2[0] - (p3[0]-p1[0]) * T, p2[1] - (p3[1]-p1[1]) * T];
    d += ` C${f(c1[0])},${f(c1[1])} ${f(c2[0])},${f(c2[1])} ${f(p2[0])},${f(p2[1])}`;
  }
  return d + "Z";
}

/* ============ 拡大・縮小・移動 ============ */
const view = { k:1, tx:0, ty:0 };
let W0 = 0, H0 = 0;          /* 地図の表示サイズ（等倍のとき） */
let CURRENT = [];            /* いま表示しているスポット */
let ACTIVE = null;           /* ふきだしを開いているスポット */

const clamp = (v,a,b) => Math.max(a, Math.min(b, v));

function measure(){
  const box = document.getElementById("illmap");
  W0 = box.clientWidth; H0 = box.clientHeight;
}

function clampView(){
  view.k = clamp(view.k, 1, 6);
  view.tx = clamp(view.tx, W0 - W0 * view.k, 0);
  view.ty = clamp(view.ty, H0 - H0 * view.k, 0);
}

function applyView(){
  const box = document.getElementById("illmap");
  if(!box) return;
  clampView();
  const svg = box.querySelector("svg:not(.compass):not(.leads)");
  if(svg){
    svg.style.transform = `translate(${view.tx}px,${view.ty}px) scale(${view.k})`;
    svg.style.setProperty("--k", view.k);
    /* 拡大するほど線を細く（2.2px → 1.1px） */
    svg.style.setProperty("--sw", (2.2 / Math.min(2, 0.6 + 0.4 * view.k)).toFixed(2) + "px");
    /* 島の厚みも倍率で割って、見た目の厚みを一定に保つ */
    const sh = svg.querySelector("#landShadow");
    if(sh) sh.setAttribute("transform",
      `translate(${(13/view.k).toFixed(2)},${(16/view.k).toFixed(2)})`);
    const ap = svg.querySelector("#airportMark");
    if(ap) ap.setAttribute("transform",
      `translate(${ap.dataset.x},${ap.dataset.y}) scale(${(1/view.k).toFixed(4)})`);
  }
  box.classList.toggle("zoomed", view.k > 1.02);
  box.classList.toggle("detail", view.k >= 1.4);   /* 少し拡大したらスポット名と市町村名を出す */
  const hint = box.querySelector(".zoomhint");
  if(hint) hint.textContent = view.k > 1.02 ? "×" + view.k.toFixed(1) : "";
  placePins();
}

/* ある一点を中心に拡大する */
function zoomAt(k2, cx, cy){
  k2 = clamp(k2, 1, 6);
  const r = k2 / view.k;
  view.tx = cx - (cx - view.tx) * r;
  view.ty = cy - (cy - view.ty) * r;
  view.k = k2;
  applyView();
}

function setupZoom(box){
  let pts = new Map(), lastD = 0, lastMid = null, moved = 0;

  box.addEventListener("pointerdown", e => {
    if(e.target.closest(".tip") || e.target.closest(".mapctl")) return;
    box.setPointerCapture(e.pointerId);
    pts.set(e.pointerId, [e.clientX, e.clientY]);
    moved = 0; lastD = 0; lastMid = null;
    box.classList.add("dragging");
  });

  box.addEventListener("pointermove", e => {
    if(!pts.has(e.pointerId)) return;
    const prev = pts.get(e.pointerId);
    pts.set(e.pointerId, [e.clientX, e.clientY]);
    const r = box.getBoundingClientRect();

    if(pts.size === 1){
      if(view.k <= 1.02) return;                 /* 等倍のときは動かさない */
      const dx = e.clientX - prev[0], dy = e.clientY - prev[1];
      moved += Math.hypot(dx, dy);
      view.tx += dx; view.ty += dy;
      applyView();
    } else if(pts.size === 2){
      const [a,b] = [...pts.values()];
      const d = Math.hypot(a[0]-b[0], a[1]-b[1]);
      const mid = [(a[0]+b[0])/2 - r.left, (a[1]+b[1])/2 - r.top];
      if(lastD){
        moved += 10;
        if(lastMid){ view.tx += mid[0]-lastMid[0]; view.ty += mid[1]-lastMid[1]; }
        zoomAt(view.k * (d / lastD), mid[0], mid[1]);
      }
      lastD = d; lastMid = mid;
    }
  });

  const end = e => {
    pts.delete(e.pointerId);
    if(pts.size < 2){ lastD = 0; lastMid = null; }
    if(pts.size === 0) box.classList.remove("dragging");
  };
  box.addEventListener("pointerup", end);
  box.addEventListener("pointercancel", end);

  /* ドラッグした直後のクリックでふきだしが開かないように */
  box.addEventListener("click", e => {
    if(moved > 8){ moved = 0; return; }
    if(!e.target.closest(".pin:not(.venue)") && !e.target.closest(".tip")) hideTip();
  }, true);

  box.addEventListener("wheel", e => {
    e.preventDefault();
    const r = box.getBoundingClientRect();
    zoomAt(view.k * (e.deltaY < 0 ? 1.18 : 1/1.18), e.clientX - r.left, e.clientY - r.top);
  }, { passive:false });

  box.addEventListener("dblclick", e => {
    const r = box.getBoundingClientRect();
    zoomAt(view.k >= 5.9 ? 1 : view.k * 1.8, e.clientX - r.left, e.clientY - r.top);
  });

  box.querySelector(".mapctl").addEventListener("click", e => {
    const b = e.target.closest("button");
    if(!b) return;
    if(b.dataset.z === "in")  zoomAt(view.k * 1.5, W0/2, H0/2);
    if(b.dataset.z === "out") zoomAt(view.k / 1.5, W0/2, H0/2);
    if(b.dataset.z === "reset"){ view.k = 1; view.tx = 0; view.ty = 0; applyView(); }
  });

  addEventListener("resize", () => { measure(); applyView(); });
  measure();
  applyView();
}

/* ============ ピンの配置 ============ */
/* 画面上の座標で重なりを判定するので、拡大するほど自然にほどけます */
function placePins(){
  const box = document.getElementById("illmap");
  if(!box || !W0) return;

  const scr = (lng, lat) => [
    px(lng) / MAPW * W0 * view.k + view.tx,
    py(lat) / MAPH * H0 * view.k + view.ty
  ];

  const GAP = view.k >= 1.4 ? 30 : 21;            /* 画面上でこれ以上は近づけない(px)。全体表示では小さいピン */
  const placed = [scr(VENUE.lng, VENUE.lat)];

  const vp = box.querySelector(".pin.venue"), vl = box.querySelector(".venue-label");
  if(vp){ vp.style.left = placed[0][0] + "px"; vp.style.top = placed[0][1] + "px"; }
  if(vl){ vl.style.left = placed[0][0] + "px"; vl.style.top = placed[0][1] + "px"; }

  let leads = "";
  box.querySelectorAll(".pin:not(.venue)").forEach((el, i) => {
    const s = CURRENT[i];
    if(!s) return;
    const [ox, oy] = scr(s.lng, s.lat);
    let x = ox, y = oy, n = 0;
    const out = (x, y) => x < 15 || x > W0 - 15 || y < 15 || y > H0 - 15;
    while((placed.some(([a,b]) => Math.hypot(a-x, b-y) < GAP) || (n > 0 && !out(ox, oy) && out(x, y))) && n < 60){
      const ang = n * 1.9, rad = GAP * (1 + n * 0.16);
      x = ox + Math.cos(ang) * rad;
      y = oy + Math.sin(ang) * rad * 0.85;
      n++;
    }
    placed.push([x,y]);
    if(Math.hypot(x-ox, y-oy) > 8)
      leads += `<g class="${kc(s)}"><line x1="${ox.toFixed(1)}" y1="${oy.toFixed(1)}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/><circle cx="${ox.toFixed(1)}" cy="${oy.toFixed(1)}" r="2.6"/></g>`;
    el.style.left = x + "px";
    el.style.top  = y + "px";
    el.dataset.sx = x; el.dataset.sy = y;
  });

  const lsvg = box.querySelector(".leads");
  if(lsvg) lsvg.innerHTML = leads;
  placeLabels(box);
}

/* スポット名のふだ。右・左・下・上の順に空いている場所をさがして置く。
   ほかのピンや、ほかのふだ、拡大ボタン、方位記号の上には重ねない。どこも空いていなければ出さない */
function placeLabels(box){
  const boxes = [];
  const hit = r => boxes.some(o => !(r.r <= o.l || r.l >= o.r || r.b <= o.t || r.t >= o.b));
  const inside = r => r.l >= 4 && r.r <= W0 - 4 && r.t >= 4 && r.b <= H0 - 4;

  boxes.push({ l:W0-58, t:0, r:W0, b:150 });              /* 拡大・縮小ボタン */
  boxes.push({ l:W0-72, t:H0-72, r:W0, b:H0 });           /* 方位記号 */

  /* ピンそのものを先に「置けない場所」として登録する */
  const P = 15;
  box.querySelectorAll(".pin").forEach(p => {
    const x = parseFloat(p.style.left), y = parseFloat(p.style.top);
    const r = p.classList.contains("venue") ? 19 : P;
    boxes.push({ l:x-r, t:y-r, r:x+r, b:y+r });
  });

  box.querySelectorAll(".pin:not(.venue)").forEach(pin => {
    const lb = box.querySelector(`.plabel[data-name="${CSS.escape(pin.dataset.name)}"]`);
    if(!lb) return;
    const x = +pin.dataset.sx, y = +pin.dataset.sy;
    lb.style.display = "";
    const w = lb.offsetWidth, h = lb.offsetHeight, g = P + 3;

    const cands = [
      { l:x + g,       t:y - h/2 },          /* 右 */
      { l:x - g - w,   t:y - h/2 },          /* 左 */
      { l:x - w/2,     t:y + g - 2 },        /* 下 */
      { l:x - w/2,     t:y - g + 2 - h },    /* 上 */
    ].map(c => ({ l:c.l, t:c.t, r:c.l + w, b:c.t + h }));

    const ok = cands.find(r => inside(r) && !hit(r));
    if(!ok){ lb.style.display = "none"; return; }
    boxes.push(ok);
    lb.style.left = ok.l + "px";
    lb.style.top  = ok.t + "px";
  });
}

function syncMap(list){
  const box = document.getElementById("illmap");
  if(!box || !box.querySelector("svg:not(.compass):not(.leads)")) return;

  box.querySelectorAll(".pin:not(.venue), .plabel").forEach(p => p.remove());
  hideTip();

  CURRENT = list.filter(s => s.lat && s.lng);

  CURRENT.forEach(s => {
    const el = document.createElement("div");
    el.className = "pin " + kc(s);
    if(PIN_MARK === "icon"){ el.innerHTML = icon(s.cat); el.title = pad(s.no) + " " + s.name; }
    else el.textContent = pad(s.no);
    el.dataset.name = s.name;
    el.addEventListener("click", () => showTip(s, el));
    box.appendChild(el);

    /* 地図には名前を出さない。カテゴリはピンの色で見せ、名前はタップした詳細で出す */
  });

  measure();
  placePins();
}

/* ================= スポットの詳細シート ================= */
const esc = t => String(t).replace(/"/g, "&quot;");

function openSheet(name){
  const s = SPOTS.find(x => x.name === name);
  if(!s) return;
  const sheet = document.getElementById("sheet"), bg = document.getElementById("sheetBg");

  sheet.innerHTML = `
    <div class="grab"></div>
    ${s.img ? `<div class="photo"><img src="${s.img}" alt="${esc(s.name)}"></div>` : ""}
    ${s.img && s.credit ? `<div class="cred">photo: ${s.credit}</div>` : ""}
    <div class="body">
      <div class="sno ${kc(s)}">${pad(s.no)}</div>
      <h3>${s.name}</h3>
      <div class="meta ${s.by}">
        <i></i><span class="who">${NAMES[s.by]}のおすすめ</span>
        <span class="sep">/</span><b class="${kc(s)}">${icon(s.cat)}${s.cat}</b>
        <span class="sep">/</span><span>${s.city}</span>
      </div>
      <p class="desc${s.comment ? "" : " todo"}">${s.comment || "コメント待ち　—　ここにお二人の一言が入ります"}</p>
      <div class="tags">${(s.tags||[]).map(t => `<span class="tag">${t}</span>`).join("")}</div>
      ${s.web ? `<a class="web" href="${s.web}" target="_blank" rel="noopener">公式サイトを見る →</a>` : ""}
      <div class="acts">
        <a class="go" href="${mapUrl(s)}" target="_blank" rel="noopener">Googleマップで開く</a>
        <button class="close" type="button">閉じる</button>
      </div>
    </div>`;

  sheet.hidden = false; bg.hidden = false;
  void sheet.offsetHeight;                       /* 一度レイアウトさせてから動かす */
  sheet.classList.add("on"); bg.classList.add("on");
  document.body.style.overflow = "hidden";
  sheet.querySelector(".close").addEventListener("click", closeSheet);
}

function closeSheet(){
  const sheet = document.getElementById("sheet"), bg = document.getElementById("sheetBg");
  sheet.classList.remove("on"); bg.classList.remove("on");
  document.body.style.overflow = "";
  setTimeout(() => { sheet.hidden = true; bg.hidden = true; }, 320);
}

document.getElementById("sheetBg").addEventListener("click", closeSheet);
addEventListener("keydown", e => { if(e.key === "Escape") closeSheet(); });

function showTip(s, el){
  document.querySelectorAll("#illmap .pin").forEach(p => p.classList.remove("act"));
  el.classList.add("act");
  ACTIVE = s;
  openSheet(s.name);
}

function hideTip(){
  ACTIVE = null;
  document.querySelectorAll("#illmap .pin").forEach(p => p.classList.remove("act"));
}


document.getElementById("cards").addEventListener("click", e => {
  const c = e.target.closest(".cell");
  if(c) openSheet(c.dataset.name);
});

function wireGroup(id, key){
  document.getElementById(id).addEventListener("click", e => {
    const chip = e.target.closest(".chip");
    if(!chip) return;
    document.querySelectorAll("#" + id + " .chip").forEach(c => c.classList.toggle("on", c === chip));
    state[key] = chip.dataset.v;
    render();
  });
}
wireGroup("fCat", "cat");
document.getElementById("fArea").addEventListener("click", e => {
  const chip = e.target.closest(".chip");
  if(!chip) return;
  document.querySelectorAll("#fArea .chip").forEach(c => c.classList.toggle("on", c === chip));
  state.region = chip.dataset.v; state.city = "";
  buildCities(); render();
});
document.getElementById("fCity").addEventListener("click", e => {
  const chip = e.target.closest(".chip");
  if(!chip) return;
  state.city = state.city === chip.dataset.v ? "" : chip.dataset.v;   /* もう一度押すと地方一覧に戻る */
  buildCities(); render();
});

document.getElementById("resetBtn").addEventListener("click", () => {
  state.cat = ""; state.region = ""; state.city = "";
  buildCities();
  document.querySelectorAll(".frow .chip").forEach(c => c.classList.toggle("on", c.dataset.v === ""));
  render();
});

document.getElementById("mapHint").textContent = PIN_MARK === "icon"
  ? "マークはカテゴリです（上のボタンと同じ）。タップすると紹介が開きます。2本指でひろげると拡大できます。"
  : "番号の色はカテゴリです（上のボタンと同じ）。タップすると紹介が開きます。2本指でひろげると拡大できます。";
buildFilters();
buildMap();   /* 中で render() を呼ぶ */
</script>
