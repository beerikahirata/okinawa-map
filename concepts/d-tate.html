<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>D｜縦組み ｜ ふたりのすきな沖縄</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f7f4ea;
  --ink:#282723;
  --ink2:#66645b;
  --ink3:#a5a294;
  --rule:#ddd8c8;
  --aka:#b0472f;
  --jp:"Zen Maru Gothic",system-ui,sans-serif;
  --en:"Quicksand",system-ui,sans-serif;
  --s1:8px;--s2:16px;--s3:24px;--s4:40px;--s5:72px;--s6:112px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--jp);line-height:2;letter-spacing:.03em;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:0 24px}

/* ---- ヒーロー：縦組み ---- */
.hero{position:relative;padding:var(--s5) 0 var(--s6);min-height:86svh;display:flex}
.hero .in{max-width:760px;margin:0 auto;padding:0 24px;width:100%;display:flex;justify-content:space-between;gap:var(--s4)}
.hero .side{display:flex;flex-direction:column;justify-content:space-between;padding-bottom:var(--s2)}
.hero .eb{font-family:var(--en);font-weight:600;font-size:10.5px;letter-spacing:.26em;color:var(--ink3)}
.hero .lead{max-width:13em;font-size:13px;line-height:2.35;color:var(--ink2);letter-spacing:.06em}
.hero .date{margin-top:var(--s3);font-family:var(--en);font-weight:600;font-size:11px;letter-spacing:.2em;color:var(--aka)}
.tate{
  writing-mode:vertical-rl;text-orientation:mixed;
  font-weight:500;font-size:clamp(30px,9.4vw,52px);line-height:1.85;letter-spacing:.24em;
  padding-top:2px;
}
.tate .k{color:var(--aka)}
.hero .seal{
  position:absolute;right:24px;bottom:var(--s5);width:46px;height:46px;border:1px solid var(--aka);
  color:var(--aka);font-size:10px;letter-spacing:.06em;display:grid;place-items:center;line-height:1.5;text-align:center;
}

/* ---- 章 ---- */
.chap{display:flex;align-items:center;gap:var(--s2);margin-bottom:var(--s4)}
.chap h2{font-weight:500;font-size:15px;letter-spacing:.3em;white-space:nowrap}
.chap::after{content:"";flex:1;height:1px;background:var(--rule)}
.chap span{font-family:var(--en);font-weight:600;font-size:10px;letter-spacing:.2em;color:var(--ink3)}

/* ---- 地図 ---- */
.mapsec{padding-bottom:var(--s6)}
.map svg{width:100%;height:auto;display:block;overflow:visible}
.map .sea{fill:none}
.map .waves path{stroke:#cfd6cb;stroke-width:2.2;fill:none;stroke-linecap:round}
.map .land,.map .isle{fill:#eeebdd;stroke:#8d8a78;stroke-width:1;vector-effect:non-scaling-stroke}
.map .place{font-family:var(--jp);font-size:12px;fill:var(--ink3);letter-spacing:.14em}
.map .pin{cursor:pointer}
.map .pinbg{fill:var(--paper);stroke:var(--aka);stroke-width:1.1}
.map .pintx{font-family:var(--en);font-weight:700;font-size:12px;fill:var(--aka)}
.map .pin:hover .pinbg{fill:var(--aka)}
.map .pin:hover .pintx{fill:var(--paper)}
.map .lead2{stroke:var(--aka);stroke-width:.6;opacity:.5}
.map .vring{fill:none;stroke:var(--ink);stroke-width:1;stroke-dasharray:2 3}
.map .vdot{fill:var(--ink)}
.map .vtx{font-family:var(--jp);font-weight:500;font-size:13px;fill:var(--ink);letter-spacing:.12em;
  paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round}
.maphint{margin-top:var(--s3);font-size:11.5px;color:var(--ink3);letter-spacing:.06em}

/* ---- 一覧：縦の罫で区切る ---- */
.list{padding-bottom:var(--s6)}
.item{display:grid;grid-template-columns:auto 1fr;gap:var(--s3);padding:var(--s3) 0;cursor:pointer;
  border-bottom:1px dotted var(--rule)}
.item:hover{background:rgba(176,71,47,.04)}
.item .n{writing-mode:vertical-rl;font-family:var(--en);font-weight:600;font-size:11px;letter-spacing:.18em;
  color:var(--aka);border-left:1px solid var(--rule);padding-left:var(--s2);min-height:52px}
.item h3{font-weight:500;font-size:17px;line-height:1.75;letter-spacing:.1em}
.item .m{margin-top:2px;font-size:11px;letter-spacing:.14em;color:var(--ink3)}
.item p{margin-top:var(--s1);font-size:13px;line-height:2.15;color:var(--ink2);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

footer{border-top:1px solid var(--rule);padding:var(--s5) 0 var(--s6)}
footer .in{display:flex;justify-content:space-between;align-items:flex-end}
footer .m{font-size:13px;letter-spacing:.16em;color:var(--ink2)}
footer .n{margin-top:var(--s2);font-family:var(--en);font-weight:600;font-size:16px;letter-spacing:.18em}
footer .d{margin-top:2px;font-family:var(--en);font-size:10.5px;letter-spacing:.2em;color:var(--ink3)}
footer .c{margin-top:var(--s4);font-size:10px;color:var(--ink3)}

/* ---- シート ---- */
.sheetbg{position:fixed;inset:0;background:rgba(40,39,35,.42);opacity:0;pointer-events:none;transition:opacity .22s;z-index:50}
.sheetbg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--paper);border-top:1px solid var(--ink);
  padding:var(--s4) 24px var(--s5);transform:translateY(101%);transition:transform .32s cubic-bezier(.2,.9,.25,1);
  max-height:88vh;overflow:auto;max-width:760px;margin:0 auto}
.sheet.on{transform:none}
.sheet h3{font-weight:500;font-size:21px;line-height:1.7;letter-spacing:.12em}
.sheet .m{margin-top:var(--s2);font-size:11px;letter-spacing:.16em;color:var(--ink3)}
.sheet p{margin-top:var(--s3);font-size:14px;line-height:2.3;color:var(--ink2)}
.sheet .t{margin-top:var(--s3);display:flex;flex-wrap:wrap;gap:0 14px;font-size:11.5px;color:var(--ink3)}
.sheet .t span::before{content:"#";opacity:.5;margin-right:.1em}
.sheet .btns{margin-top:var(--s4);display:flex;gap:var(--s3);align-items:center}
.sheet .go{flex:1;text-align:center;text-decoration:none;background:var(--aka);color:var(--paper);
  font-size:13px;letter-spacing:.16em;padding:15px 0}
.sheet .cl{background:none;border:0;font-family:var(--jp);font-size:12.5px;color:var(--ink3);cursor:pointer;letter-spacing:.1em}
</style>
</head>
<body>

<header class="hero">
  <div class="in">
    <div class="side">
      <p class="eb">The Okinawa We Love</p>
      <div>
        <p class="lead">観光地もそうでない場所も、二人が好きな沖縄を集めました。</p>
        <p class="date">2026.10.11 — 美々ビーチいとまん</p>
      </div>
    </div>
    <h1 class="tate">ふたりの<span class="k">すきな沖縄</span></h1>
  </div>
</header>

<section class="mapsec"><div class="wrap">
  <div class="chap"><h2>地図</h2><span>The Map</span></div>
  <div class="map" id="map"></div>
  <p class="maphint">番号をおすと、その場所の紹介がひらきます</p>
</div></section>

<section class="list"><div class="wrap">
  <div class="chap"><h2>三十のすきな場所</h2><span>30 Places</span></div>
  <div id="list"></div>
</div></section>

<footer><div class="wrap">
  <div class="in">
    <div>
      <p class="m">沖縄で会いましょう。</p>
      <div class="n">Hiroaki &amp; Erika</div>
      <div class="d">2026.10.11</div>
    </div>
    <div class="tate" style="font-size:13px;letter-spacing:.3em;color:var(--aka)">結婚式</div>
  </div>
  <p class="c">地形データ © OpenStreetMap contributors</p>
</div></footer>

<div class="sheetbg" id="sheetbg"></div>
<div class="sheet" id="sheet">
  <h3 data-name></h3>
  <div class="m" data-meta></div>
  <p data-comment></p>
  <div class="t" data-tags></div>
  <div class="btns">
    <a class="go" data-gmap target="_blank" rel="noopener">Googleマップで開く</a>
    <button class="cl" data-close>閉じる</button>
  </div>
</div>

<script src="data.js?v=2"></script>
<script src="common.js?v=2"></script>
<script>
const M = window.OKI;
const KAN = ["一","二","三","四","五","六","七","八","九","十"];
const kansuji = n => n <= 10 ? KAN[n-1] : n < 20 ? "十" + (n%10 ? KAN[n%10-1] : "") : KAN[Math.floor(n/10)-1] + "十" + (n%10 ? KAN[n%10-1] : "");

renderMap(document.getElementById("map"), { pins:"none" });
const svg = document.querySelector("#map svg");
const seed = [{ x:M.venue.x, y:M.venue.y }];
for(let d = 26; d <= 150; d += 26) seed.push({ x:M.venue.x + d, y:M.venue.y });
const pos = spread(M.spots, 29, seed);
svg.insertAdjacentHTML("beforeend", `<g class="pins">${pos.map((q,i) => `
  <g class="pin" data-i="${i}">
    ${q.moved > 3 ? `<line class="lead2" x1="${q.ox.toFixed(1)}" y1="${q.oy.toFixed(1)}" x2="${q.x.toFixed(1)}" y2="${q.y.toFixed(1)}"/>` : ""}
    <circle class="pinbg" cx="${q.x.toFixed(1)}" cy="${q.y.toFixed(1)}" r="12"/>
    <text class="pintx" x="${q.x.toFixed(1)}" y="${(q.y+4.2).toFixed(1)}" text-anchor="middle">${i+1}</text>
  </g>`).join("")}</g>`);

renderList(document.getElementById("list"), (s,i) => `
  <div class="item" data-i="${i}">
    <div class="n">${kansuji(i+1)}</div>
    <div>
      <h3>${s.name}</h3>
      <div class="m">${s.area} ／ ${s.cat}${s.min ? " ／ 車"+s.min+"分" : ""}</div>
      <p>${s.comment || ""}</p>
    </div>
  </div>`);

wireSheet();
</script>
</body>
</html>
