<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>C｜夜 ｜ ふたりのすきな沖縄</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#141b16;
  --bg2:#19221b;
  --cream:#ece7d8;
  --cream2:#a9aa9b;
  --cream3:#6c7268;
  --line:rgba(236,231,216,.16);
  --brass:#cdb681;
  --jp:"Zen Maru Gothic",system-ui,sans-serif;
  --en:"Quicksand",system-ui,sans-serif;
  --s1:8px;--s2:16px;--s3:24px;--s4:40px;--s5:72px;--s6:112px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--cream);font-family:var(--jp);line-height:2;letter-spacing:.03em;-webkit-font-smoothing:antialiased}
.wrap{max-width:740px;margin:0 auto;padding:0 24px}

/* ---- 地図がそのままヒーロー ---- */
.stage{position:relative;min-height:100svh;padding:64px 0 96px;overflow:hidden}
.stage::before{content:"";position:absolute;left:50%;top:44%;width:150vmax;height:150vmax;transform:translate(-50%,-50%);
  background:radial-gradient(circle,rgba(120,160,130,.16) 0%,rgba(120,160,130,0) 62%);pointer-events:none}
.top{position:absolute;top:0;left:0;right:0;z-index:3;padding:20px 24px;display:flex;justify-content:space-between;align-items:baseline}
.top b{font-weight:500;font-size:12px;letter-spacing:.2em;color:var(--cream2)}
.top span{font-family:var(--en);font-weight:600;font-size:11px;letter-spacing:.2em;color:var(--cream3)}

.map{position:relative;z-index:2;max-width:560px;margin:0 auto}
.map svg{width:100%;height:auto;display:block;overflow:visible}
.map .sea{fill:none}
.map .waves path{stroke:rgba(150,190,165,.14);stroke-width:2.4;fill:none;stroke-linecap:round}
.map .land,.map .isle{fill:#1c261e;stroke:#42604a;stroke-width:1;vector-effect:non-scaling-stroke}
.map .place{font-family:var(--jp);font-size:12px;fill:#5d6a5c;letter-spacing:.14em}
.map .pin{cursor:pointer}
.map .pinbg{fill:var(--cream);filter:drop-shadow(0 0 7px rgba(236,231,216,.75))}
.map .pin:hover .pinbg{fill:var(--brass);filter:drop-shadow(0 0 11px rgba(205,182,129,.95))}
.map .lead2{stroke:rgba(236,231,216,.3);stroke-width:.6}
.map .vring{fill:none;stroke:var(--brass);stroke-width:1;opacity:.8}
.map .vdot{fill:var(--brass);filter:drop-shadow(0 0 8px rgba(205,182,129,.8))}
.map .vtx{font-family:var(--jp);font-weight:500;font-size:13px;fill:var(--brass);letter-spacing:.12em}

.title{position:relative;z-index:3;margin-top:var(--s5);text-align:center}
.title .eb{font-family:var(--en);font-weight:600;font-size:10.5px;letter-spacing:.34em;color:var(--brass)}
.title h1{margin-top:var(--s3);font-weight:500;font-size:clamp(29px,8.4vw,46px);line-height:1.7;letter-spacing:.2em;padding-left:.2em}
.title .lead{margin:var(--s3) auto 0;max-width:23em;font-size:13px;line-height:2.3;color:var(--cream2);letter-spacing:.08em}
.title .hint{margin-top:var(--s4);font-size:11px;letter-spacing:.14em;color:var(--cream3)}

/* ---- 一覧 ---- */
.list{background:var(--bg2);padding:var(--s6) 0}
.lhead{display:flex;align-items:baseline;justify-content:space-between;padding-bottom:var(--s2);border-bottom:1px solid var(--line)}
.lhead h2{font-weight:500;font-size:15px;letter-spacing:.24em}
.lhead span{font-family:var(--en);font-weight:600;font-size:10.5px;letter-spacing:.2em;color:var(--cream3)}
.item{display:grid;grid-template-columns:34px 1fr;gap:var(--s2);padding:var(--s4) 0;border-bottom:1px solid var(--line);cursor:pointer}
.item:hover{background:rgba(236,231,216,.03)}
.item .n{font-family:var(--en);font-weight:600;font-size:11px;color:var(--brass);padding-top:6px;letter-spacing:.1em}
.item h3{font-weight:500;font-size:17px;line-height:1.75;letter-spacing:.1em}
.item .m{margin-top:var(--s1);font-family:var(--en);font-weight:600;font-size:10px;letter-spacing:.18em;color:var(--cream3)}
.item p{margin-top:var(--s2);font-size:13px;line-height:2.2;color:var(--cream2);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

footer{padding:var(--s6) 0;text-align:center}
footer .m{font-size:13px;letter-spacing:.16em;color:var(--cream2)}
footer .n{margin-top:var(--s3);font-family:var(--en);font-weight:500;font-size:17px;letter-spacing:.22em;color:var(--brass)}
footer .d{margin-top:var(--s1);font-family:var(--en);font-size:10.5px;letter-spacing:.24em;color:var(--cream3)}
footer .c{margin-top:var(--s5);font-size:10px;color:var(--cream3);opacity:.7}

/* ---- シート ---- */
.sheetbg{position:fixed;inset:0;background:rgba(6,10,8,.66);opacity:0;pointer-events:none;transition:opacity .22s;z-index:50}
.sheetbg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--bg2);border-top:1px solid var(--line);
  padding:var(--s4) 24px var(--s5);transform:translateY(101%);transition:transform .32s cubic-bezier(.2,.9,.25,1);
  max-height:88vh;overflow:auto;max-width:740px;margin:0 auto}
.sheet.on{transform:none}
.sheet h3{font-weight:500;font-size:21px;line-height:1.7;letter-spacing:.12em}
.sheet .m{margin-top:var(--s2);font-family:var(--en);font-weight:600;font-size:10.5px;letter-spacing:.18em;color:var(--cream3)}
.sheet p{margin-top:var(--s3);font-size:14px;line-height:2.3;color:var(--cream2)}
.sheet .t{margin-top:var(--s3);display:flex;flex-wrap:wrap;gap:0 14px;font-size:11.5px;color:var(--cream3)}
.sheet .t span::before{content:"#";opacity:.55;margin-right:.1em}
.sheet .btns{margin-top:var(--s4);display:flex;gap:var(--s3);align-items:center}
.sheet .go{flex:1;text-align:center;text-decoration:none;border:1px solid var(--brass);color:var(--brass);
  font-size:13px;letter-spacing:.16em;padding:15px 0}
.sheet .cl{background:none;border:0;font-family:var(--jp);font-size:12.5px;color:var(--cream3);cursor:pointer;letter-spacing:.1em}
</style>
</head>
<body>

<section class="stage">
  <div class="top"><b>ふたりのすきな沖縄</b><span>2026.10.11</span></div>
  <div class="map" id="map"></div>
  <div class="title">
    <p class="eb">The Okinawa We Love</p>
    <h1>ふたりの<br>すきな沖縄</h1>
    <p class="lead">観光地もそうでない場所も、二人が好きな沖縄を集めました。</p>
    <p class="hint">光っている点が、二人のすきな場所です</p>
  </div>
</section>

<section class="list"><div class="wrap">
  <div class="lhead"><h2>一覧</h2><span>30 Places</span></div>
  <div id="list"></div>
</div></section>

<footer><div class="wrap">
  <p class="m">沖縄で会いましょう。</p>
  <div class="n">Hiroaki &amp; Erika</div>
  <div class="d">2026.10.11</div>
  <p class="c">地形データ © OpenStreetMap contributors</p>
</div></footer>

<div class="sheetbg" id="sheetbg"></div>
<div class="sheet" id="sheet">
  <h3 data-name></h3>
  <div class="m" data-meta></div>
  <p data-comment></p>
  <div class="t" data-tags></div>
  <div class="btns">
    <a class="go" data-gmap target="_blank" rel="noopener">Googleマップで開く</a>
    <button class="cl" data-close>閉じる</button>
  </div>
</div>

<script src="data.js?v=2"></script>
<script src="common.js?v=2"></script>
<script>
const M = window.OKI;
renderMap(document.getElementById("map"), { pins:"none" });
const svg = document.querySelector("#map svg");
const seed = [{ x:M.venue.x, y:M.venue.y }];
for(let d = 24; d <= 150; d += 24) seed.push({ x:M.venue.x + d, y:M.venue.y });
const pos = spread(M.spots, 22, seed);
svg.insertAdjacentHTML("beforeend", `<g class="pins">${pos.map((q,i) => `
  <g class="pin" data-i="${i}">
    ${q.moved > 3 ? `<line class="lead2" x1="${q.ox.toFixed(1)}" y1="${q.oy.toFixed(1)}" x2="${q.x.toFixed(1)}" y2="${q.y.toFixed(1)}"/>` : ""}
    <circle class="pinbg" cx="${q.x.toFixed(1)}" cy="${q.y.toFixed(1)}" r="4.4"/>
    <circle cx="${q.x.toFixed(1)}" cy="${q.y.toFixed(1)}" r="17" fill="transparent"/>
  </g>`).join("")}</g>`);

renderList(document.getElementById("list"), (s,i) => `
  <div class="item" data-i="${i}">
    <div class="n">${String(i+1).padStart(2,"0")}</div>
    <div>
      <h3>${s.name}</h3>
      <div class="m">${s.area} / ${s.cat}${s.min ? " / 車"+s.min+"分" : ""}</div>
      <p>${s.comment || ""}</p>
    </div>
  </div>`);

wireSheet();
</script>
</body>
</html>
