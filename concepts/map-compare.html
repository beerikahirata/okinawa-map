<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>地図の見た目くらべ ｜ ふたりのすきな沖縄</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--jp:"Zen Maru Gothic",system-ui,sans-serif;--en:"Quicksand",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f4f2ec;color:#252722;font-family:var(--jp);line-height:1.95;-webkit-font-smoothing:antialiased}
.wrap{max-width:680px;margin:0 auto;padding:0 22px}
header{padding:64px 0 32px}
header .en{font-family:var(--en);font-weight:600;font-size:11px;letter-spacing:.24em;color:#9a9d93}
header h1{margin-top:16px;font-weight:900;font-size:clamp(25px,7vw,34px);line-height:1.5}
header p{margin-top:16px;font-size:13.5px;line-height:2.1;color:#5f6359}

section{padding:52px 0 60px}
.lab{display:flex;align-items:baseline;gap:12px;margin-bottom:6px}
.lab b{font-family:var(--en);font-weight:700;font-size:15px;letter-spacing:.12em}
.lab h2{font-weight:700;font-size:17px;letter-spacing:.06em}
.desc{font-size:12.5px;line-height:2;opacity:.7;margin-bottom:24px}
.map svg{width:100%;height:auto;display:block;overflow:visible}
.map .sea{fill:none}
.pin{cursor:pointer}

/* ============ C 夜 ============ */
.sc{background:#141b16;color:#ece7d8}
.sc .lab b,.sc .lab h2{color:#ece7d8}
.sc .waves path{stroke:rgba(150,190,165,.14);stroke-width:2.4;fill:none;stroke-linecap:round}
.sc .land,.sc .isle{fill:#1c261e;stroke:#42604a;stroke-width:1;vector-effect:non-scaling-stroke}
.sc .place{font-family:var(--jp);font-size:12px;fill:#5d6a5c;letter-spacing:.14em}
.sc .pinbg{fill:#ece7d8;filter:drop-shadow(0 0 6px rgba(236,231,216,.6))}
.sc .pintx{font-family:var(--en);font-weight:700;font-size:11px;fill:#141b16}
.sc .pin:hover .pinbg{fill:#cdb681}
.sc .ld{stroke:rgba(236,231,216,.32);stroke-width:.6}
.sc .vring{fill:none;stroke:#cdb681;stroke-width:1;opacity:.8}
.sc .vdot{fill:#cdb681;filter:drop-shadow(0 0 8px rgba(205,182,129,.8))}
.sc .vtx{font-family:var(--jp);font-weight:500;font-size:13px;fill:#cdb681;letter-spacing:.12em}

/* ============ D 縦組み・紙 ============ */
.sd{background:#f7f4ea}
.sd .waves path{stroke:#cfd6cb;stroke-width:2.2;fill:none;stroke-linecap:round}
.sd .land,.sd .isle{fill:#eeebdd;stroke:#8d8a78;stroke-width:1;vector-effect:non-scaling-stroke}
.sd .place{font-family:var(--jp);font-size:12px;fill:#a5a294;letter-spacing:.14em}
.sd .pinbg{fill:#f7f4ea;stroke:#b0472f;stroke-width:1.1}
.sd .pintx{font-family:var(--en);font-weight:700;font-size:11px;fill:#b0472f}
.sd .pin:hover .pinbg{fill:#b0472f}
.sd .pin:hover .pintx{fill:#f7f4ea}
.sd .ld{stroke:#b0472f;stroke-width:.6;opacity:.5}
.sd .vring{fill:none;stroke:#282723;stroke-width:1;stroke-dasharray:2 3}
.sd .vdot{fill:#282723}
.sd .vtx{font-family:var(--jp);font-weight:500;font-size:13px;fill:#282723;letter-spacing:.12em;
  paint-order:stroke;stroke:#f7f4ea;stroke-width:5px;stroke-linejoin:round}

/* ============ E 大きな文字・カラフル ============ */
.se{background:#dbeced}
.se .lab b,.se .lab h2{color:#1f6f78}
.se .waves path{stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;opacity:.75}
.se .land,.se .isle{fill:#e9dcc0;stroke:#fff;stroke-width:2.4;vector-effect:non-scaling-stroke}
.se .place{font-family:var(--jp);font-weight:500;font-size:12px;fill:#6f8b8c;letter-spacing:.1em}
.se .pinbg{fill:#1f6f78;stroke:#fff;stroke-width:2}
.se .pintx{font-family:var(--en);font-weight:700;font-size:12px;fill:#fff}
.se .pin:hover .pinbg{fill:#4c7a44}
.se .ld{stroke:#1f6f78;stroke-width:1;opacity:.45}
.se .vring{fill:none;stroke:#c0562f;stroke-width:2}
.se .vdot{fill:#c0562f}
.se .vtx{font-family:var(--jp);font-weight:700;font-size:14px;fill:#a4471f;letter-spacing:.06em;
  paint-order:stroke;stroke:#dbeced;stroke-width:5px;stroke-linejoin:round}

.foot{padding:40px 22px 96px;font-size:12px;line-height:2;color:#9a9d93}
.foot a{color:#5f6359}
</style>
</head>
<body>

<header class="wrap">
  <p class="en">Map — 3 looks</p>
  <h1>地図の見た目くらべ</h1>
  <p>ピンはぜんぶ番号（A・Dと同じ形）にそろえました。あとは色と質感だけの違いです。番号を押すと、その場所の紹介が開きます。</p>
</header>

<section class="sc"><div class="wrap">
  <div class="lab"><b>C</b><h2>夜</h2></div>
  <p class="desc">深い緑の中に島が浮かぶ。番号は光って見える</p>
  <div class="map" id="mc"></div>
</div></section>

<section class="sd"><div class="wrap">
  <div class="lab"><b>D</b><h2>紙</h2></div>
  <p class="desc">生成りの紙に、赤瓦の朱の番号。いちばん落ち着いていて、紙版にもそのまま出せる</p>
  <div class="map" id="md"></div>
</div></section>

<section class="se"><div class="wrap">
  <div class="lab"><b>E</b><h2>カラフル</h2></div>
  <p class="desc">砂色の島と水色の海。番号がはっきり見えて、いちばん探しやすい</p>
  <div class="map" id="me"></div>
</div></section>

<div class="wrap foot">
  ← <a href="./">デザイン5案にもどる</a><br>
  地形データ © OpenStreetMap contributors
</div>

<div class="sheetbg" id="sheetbg"></div>
<div class="sheet" id="sheet">
  <h3 data-name></h3>
  <div class="m" data-meta></div>
  <p data-comment></p>
  <div class="t" data-tags></div>
  <div class="btns">
    <a class="go" data-gmap target="_blank" rel="noopener">Googleマップで開く</a>
    <button class="cl" data-close>閉じる</button>
  </div>
</div>
<style>
.sheetbg{position:fixed;inset:0;background:rgba(35,38,32,.45);opacity:0;pointer-events:none;transition:opacity .22s;z-index:50}
.sheetbg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;background:#fbfaf6;border-top:1px solid #dedad0;
  padding:36px 22px 56px;transform:translateY(101%);transition:transform .3s cubic-bezier(.2,.9,.25,1);
  max-height:88vh;overflow:auto;max-width:680px;margin:0 auto}
.sheet.on{transform:none}
.sheet h3{font-weight:700;font-size:21px;line-height:1.6}
.sheet .m{margin-top:8px;font-size:11.5px;letter-spacing:.1em;color:#9a9d93}
.sheet p{margin-top:20px;font-size:14px;line-height:2.2;color:#5f6359}
.sheet .t{margin-top:20px;display:flex;flex-wrap:wrap;gap:0 14px;font-size:11.5px;color:#9a9d93}
.sheet .t span::before{content:"#";opacity:.5;margin-right:.1em}
.sheet .btns{margin-top:32px;display:flex;gap:20px;align-items:center}
.sheet .go{flex:1;text-align:center;text-decoration:none;background:#252722;color:#fbfaf6;font-weight:700;
  font-size:13.5px;letter-spacing:.06em;padding:15px 0;border-radius:3px}
.sheet .cl{background:none;border:0;font-family:var(--jp);font-size:12.5px;color:#9a9d93;cursor:pointer}
</style>

<script src="data.js?v=2"></script>
<script src="common.js?v=2"></script>
<script>
const M = window.OKI;

function numbered(elId, gap){
  const el = document.getElementById(elId);
  renderMap(el, { pins:"none" });
  const svg = el.querySelector("svg");
  const seed = [{ x:M.venue.x, y:M.venue.y }];
  for(let d = gap; d <= 160; d += gap) seed.push({ x:M.venue.x + d, y:M.venue.y });
  const pos = spread(M.spots, gap + 5, seed);
  svg.insertAdjacentHTML("beforeend", `<g class="pins">${pos.map((q,i) => `
    <g class="pin" data-i="${i}">
      ${q.moved > 3 ? `<line class="ld" x1="${q.ox.toFixed(1)}" y1="${q.oy.toFixed(1)}" x2="${q.x.toFixed(1)}" y2="${q.y.toFixed(1)}"/>` : ""}
      <circle class="pinbg" cx="${q.x.toFixed(1)}" cy="${q.y.toFixed(1)}" r="12"/>
      <text class="pintx" x="${q.x.toFixed(1)}" y="${(q.y+4).toFixed(1)}" text-anchor="middle">${String(i+1).padStart(2,"0")}</text>
    </g>`).join("")}</g>`);
}

numbered("mc", 26);
numbered("md", 26);
numbered("me", 26);

wireSheet();
</script>
</body>
</html>
